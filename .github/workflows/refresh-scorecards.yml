name: Refresh Scorecard Snapshots

on:
  schedule:
    - cron: '0 10 * * *'  # 10:00 UTC — refine after checking BQ ETL completion time
  workflow_dispatch:
    inputs:
      scorecard:
        description: 'Scorecard ID (or ALL)'
        required: false
        default: 'marketing-scorecard'

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: builder/package-lock.json
      - name: Install
        run: cd builder && npm ci
      - name: Check BQ ETL freshness
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          cd builder
          node -e "
            import('./scripts/refresh-snapshots/bq-client.js').then(async ({createBqClient, makeQuery}) => {
              const q = makeQuery(createBqClient());
              // Check latest row in v_trials — views don't expose ETL metadata,
              // so we probe the actual data instead.
              const { rows } = await q(\`
                SELECT MAX(SignupDate) AS max_signup FROM \\\`project-for-method-dw.revenue.v_trials\\\`
              \`);
              const maxSignup = rows[0]?.max_signup;
              if (!maxSignup) {
                console.error('ETL check FAILED: v_trials is empty');
                process.exit(1);
              }
              const ageDays = (Date.now() - new Date(maxSignup).getTime()) / 86400000;
              if (ageDays > 2) {
                console.error(\`ETL check FAILED: latest SignupDate is \${maxSignup} (\${ageDays.toFixed(1)} days old)\`);
                process.exit(1);
              }
              console.log(\`ETL freshness OK. Latest SignupDate: \${maxSignup} (\${ageDays.toFixed(1)} days old)\`);
            });
          "
      # Rebuild the materialized MRR tables BEFORE the snapshot refresh, so the
      # v_metric__* views (and the dashboard) read fresh data. These models are
      # materialized=table for query speed, so they must be rebuilt daily after ETL.
      # Requires the GCP_SA_KEY service account to have BigQuery dataEditor on the
      # `revenue` and `revenue_metrics` datasets.
      - name: Set up Python (dbt)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Refresh dbt tables
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          pip install "dbt-bigquery~=1.8"
          printf '%s' "$GCP_SA_KEY" > /tmp/dbt-sa.json
          export DBT_KEYFILE=/tmp/dbt-sa.json
          dbt run --profiles-dir ci --target ci \
            --select int_customers int_customer_mrr int_customer_mrr_lines \
                     int_mrr_movement_decomposed int_annual_mrr_movement_decomposed \
                     int_customer_annual_mrr

      - name: Refresh
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ONLY_SCORECARD: ${{ github.event.inputs.scorecard || 'marketing-scorecard' }}
        run: cd builder && node scripts/refresh-snapshots/index.js
