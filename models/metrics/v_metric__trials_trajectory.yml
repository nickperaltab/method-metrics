# Canonical metric definition for "Trials Trajectory".

models:
  - name: v_metric__trials_trajectory
    description: |
      Month-end projection of trials for the in-progress month. Divides
      trials_mtd (counted through yesterday) by complete days so far, and
      scales to the full month. NULL on the 1st, when there are no complete
      days to project from.
    config:
      materialized: view
      meta:
        answers: "If the current month continues at its month-to-date pace, how many trials will it finish with?"
        grain: "Single row, current month. Account-grain (see Trials #54)."
        filters:
          - rule: "inherits int_method_monday.trials_mtd, which excludes SignupDate >= CURRENT_DATE()"
            why: "today is unfinished; the trajectory divides by complete days only"
        methodology_source: "Method Monday convention, verified against Looker report 510f74bb page p_rh9bepy1rd on 2026-08-10: 132 / 9 * 31 = 454.67, shown as 455."
        parity_verified:
          against: "PENDING — Task 8 records the browser comparison"
          values: "PENDING"
        caveats:
          - "Noisy in the first few days of a month — a projection from one or two complete days swings widely."
          - "NULL on the 1st of the month, when elapsed_days is 0."
          - "Single-row by design. Do not chart it as a time series."
        used_by:
          - "Method Monday (Acquisition section)"
      labels:
        metric_id: ''
        layer: metrics
        type: derived
        status: queued
        source_table: int_method_monday
        source_measure_safe: ''
        depends_on: '54'
