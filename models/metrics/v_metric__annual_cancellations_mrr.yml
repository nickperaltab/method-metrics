# Canonical metric definition for "Annual Cancellations ($)" (#385).

models:
  - name: v_metric__annual_cancellations_mrr
    description: |
      Total MRR lost from customer cancellations measured at annual cohort
      grain, in dollars summed across all customers. Pre-FX — currencies
      (USD, CAD, UK) at face value, not USD-converted. Excludes internal
      Method accounts. Uses CEO-confirmed Prepay Expiry methodology.
      Foundation for annual GRR (#388).
    config:
      materialized: view
      meta:
        answers: "Same as Monthly Cancellations ($) (#379), but at annual cohort grain — reported monthly via trailing comparison."
        grain: "Period-level (annual cohort comparison, reported monthly)."
        filters:
          - rule: "Symmetric Prepay Expiry exclusion (CEO-confirmed)"
            why: "same as int_customer_mrr methodology"
          - rule: "Internal Method accounts excluded"
            why: "same as int_customer_mrr methodology"
        methodology_source: "Same as int_customer_mrr — CEO-confirmed symmetric Prepay Expiry exclusion, internal Method accounts excluded."
        parity_verified:
          against: "5 months x 4 metrics = 20 / 20 (Round 4)"
          date: "2026-05-14"
          values: "penny-match"
        caveats:
          - "Pre-FX."
          - "Annual = trailing 12-month cohort comparison."
          - "Current month NOT shown."
          - "Diverges from board-deck annual retention by ~4-6bp per the symmetric methodology."
      labels:
        metric_id: '385'
        layer: metrics
        type: simple
        status: live
        verified_at: '2026-05-14'
        source_table: v_customer_annual_mrr
        source_measure_safe: sum_cancellations
        depends_on: ''
