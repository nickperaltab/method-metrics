# Canonical metric definition for "Conversions Forecast MTD".

models:
  - name: v_metric__conversions_forecast_mtd
    description: |
      The full-month conversions forecast prorated to the elapsed window
      (conversions_forecast * elapsed_days / days_in_month), so the MTD
      actual has a like-for-like comparison instead of the full-month total.
      Returns 0 (not NULL) on the 1st of the month, when elapsed_days is 0 --
      the paired trajectory metric (#296) returns NULL in that same
      situation, so the two do not fail the same way on day one.
    config:
      materialized: view
      meta:
        answers: "How many conversions should we have by today, if the full-month forecast lands evenly?"
        grain: "Single row, current month. Period-level, derived from a full-month forecast total."
        filters:
          - rule: "inherits int_method_monday.conversions_forecast_mtd, proration is elapsed_days / days_in_month"
            why: "matches the elapsed window used by the MTD actual it is compared against"
        methodology_source: "Method Monday convention, verified against Looker report 510f74bb page p_rh9bepy1rd on 2026-08-10."
        parity_verified:
          against: "Looker Studio 'Method Monday (PROD)', report 510f74bb, page p_rh9bepy1rd, data timestamp 12:39 PM, read 2026-08-17."
          values: "55 (Looker, rounded for display) vs 54.7 (model, unrounded) -- match. Also re-verified 2026-08-17: both this view and Supabase #273 read Forecasted_Conversion (106) from revenue.method_forecast -- an earlier audit pass had wrongly claimed #273 reads Budgeted_Conversion (128) instead; that claim was disproven by reading #273's chart_sql directly."
        caveats:
          - "Source is revenue.method_forecast, an EXTERNAL table over a Google Sheet. A column rename in the sheet breaks this silently."
          - "Straight-line proration, not shaped to the forecast's own daily curve. Assumes even distribution across the month."
          - "Returns 0, not NULL, on the 1st of the month (elapsed_days = 0 multiplies the forecast to zero rather than dividing into an undefined value). The paired trajectory metrics (#296 conversions, #410/#411/#295 etc.) return NULL in the same situation via SAFE_DIVIDE -- a known asymmetry between the *_forecast_mtd and *_trajectory families on day one of a month."
          - "Single-row by design. Do not chart it as a time series."
        used_by:
          - "Method Monday (Conversions section)"
      labels:
        metric_id: '412'
        layer: metrics
        type: derived
        status: queued
        source_table: int_method_monday
        source_measure_safe: ''
        depends_on: '273'
    columns:
      - name: period
        description: Current month (single row).
        tests:
          - not_null
          - unique
      - name: value
        description: Prorated conversions forecast. Returns 0 (not NULL) on day 1, so never NULL any day of the month.
        tests:
          - not_null
