# Canonical metric definition for "Annual Expansions ($)" (#387).

models:
  - name: v_metric__annual_expansions_mrr
    description: |
      Total MRR gained from existing-customer expansions at annual cohort
      grain (customers paying more than the prior year), in dollars summed
      across all customers. Pre-FX — currencies (USD, CAD, UK) at face
      value, not USD-converted. Existing customers only — net-new customer
      revenue is tracked separately. Foundation for annual NRR (#389).
    config:
      materialized: view
      meta:
        answers: "Same as Monthly Expansions ($) (#381), but at annual cohort grain — reported monthly via trailing comparison."
        grain: "Period-level (annual cohort comparison, reported monthly)."
        filters:
          - rule: "Symmetric Prepay Expiry exclusion (CEO-confirmed)"
            why: "same as int_customer_mrr methodology"
          - rule: "Internal Method accounts excluded"
            why: "same as int_customer_mrr methodology"
        methodology_source: "Same as int_customer_mrr — CEO-confirmed symmetric Prepay Expiry exclusion, internal Method accounts excluded."
        parity_verified:
          against: "5 months x 4 metrics = 20 / 20 (Round 4)"
          date: "2026-05-14"
          values: "penny-match"
        caveats:
          - "Pre-FX."
          - "Annual = trailing 12-month cohort comparison."
          - "Current month NOT shown."
          - "Diverges from board-deck annual retention by ~4-6bp per the symmetric methodology."
      labels:
        metric_id: '387'
        layer: metrics
        type: simple
        status: live
        verified_at: '2026-05-14'
        source_table: v_customer_annual_mrr
        source_measure_safe: sum_expansions
        depends_on: ''
