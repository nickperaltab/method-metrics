# Canonical metric definition for "Annual Downgrades ($)" (#386).

models:
  - name: v_metric__annual_downgrades_mrr
    description: |
      Total MRR lost from existing-customer downgrades at annual cohort
      grain (customers paying less than the prior year but not canceling),
      in dollars summed across all customers. Pre-FX — currencies (USD,
      CAD, UK) at face value, not USD-converted. Excludes internal Method
      accounts. Inherits the v_customer_annual_mrr Prepay Expiry methodology.
    config:
      materialized: view
      meta:
        answers: "Same as Monthly Downgrades ($) (#380), but at annual cohort grain — reported monthly via trailing comparison."
        grain: "Period-level (annual cohort comparison, reported monthly)."
        filters:
          - rule: "Symmetric Prepay Expiry exclusion (CEO-confirmed)"
            why: "same as int_customer_mrr methodology"
          - rule: "Internal Method accounts excluded"
            why: "same as int_customer_mrr methodology"
        methodology_source: "Same as int_customer_mrr — CEO-confirmed symmetric Prepay Expiry exclusion, internal Method accounts excluded."
        parity_verified:
          against: "5 months x 4 metrics = 20 / 20 (Round 4)"
          date: "2026-05-14"
          values: "penny-match"
        caveats:
          - "Pre-FX."
          - "Annual = trailing 12-month cohort comparison."
          - "Current month NOT shown."
          - "Diverges from board-deck annual retention by ~4-6bp per the symmetric methodology."
        used_by:
          - "Method Monday (Revenue section, foundation for Annual GRR #388 / NRR #389)"
      labels:
        metric_id: '386'
        layer: metrics
        type: simple
        status: live
        verified_at: '2026-05-14'
        source_table: v_customer_annual_mrr
        source_measure_safe: sum_downgrades
        depends_on: ''
