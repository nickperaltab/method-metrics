# Canonical metric definition for "Trials" (#54).
#
# v_metric__trials is the *materialized* form of the `trials` metric — a BQ
# view returning (period, value) over the last 24 months. The Registry UI
# reads from `INFORMATION_SCHEMA.VIEW_OPTIONS` to surface metric metadata.
#
# This file uses dbt-bigquery's NATIVE materialization config: `description`
# becomes the BQ view's description, `labels` becomes the BQ view's labels.
# `dbt run` generates the `CREATE OR REPLACE VIEW ... OPTIONS(...) AS SELECT`
# at apply time — no custom Python deploy script needed (Option A from the
# round-1 handoff). The corresponding .sql is just the SELECT body.

models:
  - name: v_metric__trials
    description: |
      Monthly count of Method accounts that began a trial. Account-grain —
      a customer with 2 trial accounts contributes 2 trials, by design.
      Excludes test accounts, internal Method Integration partner rows,
      and the '0001-01-01' sentinel value. For unique-customer counts,
      use Customers (#373).
    config:
      materialized: view
      labels:
        metric_id: '54'
        layer: metrics
        type: simple
        status: live
        verified_at: '2026-04-07'
        source_table: v_trials
        source_measure_safe: count_star
        depends_on: ''
