# Canonical metric definition for "Trials" (#54).
#
# v_metric__trials is the *materialized* form of the `trials` metric — a BQ
# view returning (period, value) over the last 24 months. The Registry UI
# reads from `INFORMATION_SCHEMA.VIEW_OPTIONS` to surface metric metadata.
#
# This file uses dbt-bigquery's NATIVE materialization config: `description`
# becomes the BQ view's description, `labels` becomes the BQ view's labels.
# `dbt run` generates the `CREATE OR REPLACE VIEW ... OPTIONS(...) AS SELECT`
# at apply time — no custom Python deploy script needed (Option A from the
# round-1 handoff). The corresponding .sql is just the SELECT body.

models:
  - name: v_metric__trials
    description: |
      Monthly count of Method accounts that began a trial. Account-grain —
      a customer with 2 trial accounts contributes 2 trials, by design.
      Excludes test accounts, internal Method Integration partner rows,
      and the '0001-01-01' sentinel value. For unique-customer counts,
      use Customers (#373).
    config:
      materialized: view
      meta:
        answers: "How many Method accounts began a trial in each month?"
        grain: "account-level (by design). One row per Method account that began a trial. A customer with 2 trial accounts contributes 2 trials. This is canonical for Method's funnel reporting, not a flaw."
        filters:
          - rule: "IsConversionException = FALSE"
            why: "excludes accounts flagged as not real conversions (test accounts, exception cases)"
          - rule: "Partner != 'Method Integration'"
            why: "excludes internal Method Integration partner rows"
          - rule: "SignupDate != DATE('0001-01-01')"
            why: "excludes the 'no trial' sentinel value"
        methodology_source: "Existing BQ view int_trials, pre-dbt convention. Definition unchanged in migration; dbt now owns the view."
        parity_verified:
          against: "Pre-migration BQ values for the 5 most recent months (Sep 2025 – May 2026)"
          date: "2026-05-08"
          values: "all penny-match (Round 3a)"
        caveats:
          - "Account-grain by design — customers with multiple accounts contribute multiple trials. This is intentional. Use Customers (#373) for unique-customer counts."
          - "Current month is incomplete; partial values for the in-progress month."
        used_by:
          - "Method Monday (Acquisition section)"
          - "AI chart builder"
          - "Trial-to-Conversion Rate (#302) as denominator"
      labels:
        metric_id: '54'
        layer: metrics
        type: simple
        status: live
        verified_at: '2026-04-07'
        source_table: v_trials
        source_measure_safe: count_star
        depends_on: ''
