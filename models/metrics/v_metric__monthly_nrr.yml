# Canonical metric definition for "Monthly NRR %" (#383).
# CEO-confirmed methodology (2026-04-28). MUST NOT change without
# explicit CEO + Justin sign-off.

models:
  - name: v_metric__monthly_nrr
    description: |
      Monthly Net Revenue Retention — fraction of last month's MRR retained
      this month INCLUDING expansion from existing customers. Formula:
      (StartMRR - Cancellations - Downgrades + Expansions) / StartMRR.
      Pre-FX. Typical values 97-99% — expansion mostly offsets churn at
      Method's scale. Uses CEO-confirmed symmetric Prepay Expiry exclusion.
      For board reporting, reconcile against the board deck first
      (~4-6bp methodology gap).
    config:
      materialized: view
      meta:
        answers: "Fraction of last month's MRR retained this month, including expansion: (StartMRR - Cancellations - Downgrades + Expansions) / StartMRR. Typical 97-99%."
        grain: "Period-level fraction. Outputs as decimal (e.g., 0.965817 = 96.5817%)."
        methodology_source: "CEO-protected family. Methodology was explicitly confirmed by Method's CEO on 2026-04-28 (symmetric Prepay Expiry exclusion). MUST NOT change without explicit CEO + Justin sign-off. Cross-model derived metric combining the MRR family inputs."
        parity_verified:
          against: "5 months x 4 metrics = 20 / 20 spot-check (Round 5)"
          date: "2026-05-14"
          values: "match to 6 decimal places"
        caveats:
          - "Pre-FX."
          - "Symmetric Prepay Expiry methodology — diverges from board-deck retention by ~4-6bp."
          - "For any number heading to the board or external reporting, reconcile against the board deck first. These numbers will not penny-match the deck."
          - "Current month NOT shown."
        used_by:
          - "Board reporting (with deck reconciliation)"
      labels:
        metric_id: '383'
        layer: metrics
        type: derived
        status: live
        verified_at: '2026-05-14'
        source_table: ''
        source_measure_safe: ''
        depends_on: 378-379-380-381
