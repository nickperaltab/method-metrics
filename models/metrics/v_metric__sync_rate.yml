# Canonical metric definition for "Sync Rate" (#300).
#
# v_metric__sync_rate is the *materialized* form of the `sync_rate` ratio
# metric defined in models/metrics/_metrics.yml (top-level cross-model file).
# It returns (period, value) where value = SAFE_DIVIDE(syncs, trials) per
# month over the last 24 months.
#
# Cross-model ratio metrics are NOT defined on a single semantic model — the
# numerator (`syncs`) is from v_syncs, the denominator (`trials`) is from
# v_trials. Hence the metric definition lives at the top level
# (_metrics.yml), and this file carries only the materialization metadata.
#
# source_table is empty (the ratio is derived, not measured against a single
# table); source_measure_safe is empty for the same reason. depends_on is
# populated as 'numerator-denominator' = '55-54' (Syncs-Trials).

models:
  - name: v_metric__sync_rate
    description: |
      Monthly Sync Rate — sync milestone events divided by trial signups
      that month, at account-grain. Today's typical range is 50-65%. Not
      a clean "% of customers who synced" — both numerator and denominator
      are account/event counts. For exact "fraction of unique trial cohort
      that synced," a different metric would be needed.
    config:
      materialized: view
      meta:
        answers: "What fraction of trial accounts produced a sync milestone in each month?"
        grain: "account-grain by intent. Period-level output (one value per month). Both numerator (Syncs) and denominator (Trials) are intended at account-grain — see Syncs (#55) caveats for the Funnel-data nuance."
        filters:
          - rule: "inherits filters from Trials (#54) and Syncs (#55)"
            why: "Sync Rate is a cross-model ratio of the two"
        methodology_source: "Cross-model ratio defined in Supabase (#300). Numerator = #55 Syncs; denominator = #54 Trials."
        parity_verified:
          against: "Reconstructed-from-source for 10 months — SAFE_DIVIDE(SUM(syncs), SUM(trials)) vs v_metric__sync_rate (Round 3a)"
          date: "2026-05-08"
          values: "matches to 6 decimal places"
        caveats:
          - "Account-grain by intent (denominator is account-grain Trials; numerator is Funnel-entity-grain Syncs — close enough for funnel reporting since most customers have one account)."
          - "~13% inflation in numerator from re-sync events (see Syncs #55 caveats). This is part of the metric definition — re-syncs contribute to the rate."
          - "'Sync Rate' here is 'syncs per trial' volume ratio at account/event grain. Not the same as '% of unique customers who ever synced' — that's a different metric."
        used_by:
          - "AI chart builder"
          - "Forecast / budget comparison"
      labels:
        metric_id: '300'
        layer: metrics
        type: ratio
        status: live
        verified_at: ''
        source_table: ''
        source_measure_safe: ''
        depends_on: 55-54
