# Canonical metric definition for "Annual Start MRR" (#384).
# Annual cohort view of the monthly MRR family. Same methodology as the
# monthly family (CEO-confirmed symmetric Prepay Expiry exclusion),
# applied at annual cohort grain via v_customer_annual_mrr.

models:
  - name: v_metric__annual_start_mrr
    description: |
      Total MRR at the start of each annual cohort, summed across all
      customers. Pre-FX — currencies (USD, CAD, UK) at face value, not
      USD-converted. Excludes internal Method accounts. Uses CEO-confirmed
      methodology that excludes one-time Prepay Expiry write-offs.
      Foundation for annual GRR / NRR (#388 / #389). Annual cohort
      reported monthly (trailing comparison).
    config:
      materialized: view
      meta:
        answers: "Same as Monthly Start MRR (#378), but at annual cohort grain — reported monthly via trailing comparison."
        grain: "Period-level (annual cohort comparison, reported monthly)."
        filters:
          - rule: "Symmetric Prepay Expiry exclusion (CEO-confirmed)"
            why: "same as int_customer_mrr methodology"
          - rule: "Internal Method accounts excluded"
            why: "same as int_customer_mrr methodology"
        methodology_source: "Same as int_customer_mrr — CEO-confirmed symmetric Prepay Expiry exclusion, internal Method accounts excluded."
        parity_verified:
          against: "5 months x 4 metrics = 20 / 20 (Round 4)"
          date: "2026-05-14"
          values: "penny-match"
        caveats:
          - "Pre-FX."
          - "Annual = trailing 12-month cohort comparison."
          - "Current month NOT shown."
          - "Diverges from board-deck annual retention by ~4-6bp per the symmetric methodology."
      labels:
        metric_id: '384'
        layer: metrics
        type: simple
        status: live
        verified_at: '2026-05-14'
        source_table: v_customer_annual_mrr
        source_measure_safe: sum_startmrr
        depends_on: ''
