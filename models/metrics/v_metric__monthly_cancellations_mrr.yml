# Canonical metric definition for "Monthly Cancellations ($)" (#379).
#
# Inherits CEO-confirmed symmetric Prepay Expiry Income exclusion
# methodology from v_customer_mrr.

models:
  - name: v_metric__monthly_cancellations_mrr
    description: |
      Total MRR lost from customer cancellations each month, in dollars
      summed across all customers. Pre-FX — currencies (USD, CAD, UK) at
      face value, not USD-converted. Excludes internal Method accounts.
      Uses CEO-confirmed methodology that excludes one-time Prepay Expiry
      write-offs from both StartMRR and Cancellations. Foundation for
      monthly GRR.
    config:
      materialized: view
      meta:
        answers: "How much MRR did Method lose from customer cancellations in each month?"
        grain: "period-level. Underlying aggregation is customer-month."
        filters:
          - rule: "CompanyAccount NOT LIKE 'm11%' AND NOT LIKE 'm18%'"
            why: "excludes internal Method accounts"
          - rule: "Symmetric Prepay Expiry Income exclusion (CEO-confirmed 2026-04-28)"
            why: "excludes one-time Prepay Expiry write-offs, consistent with StartMRR"
          - rule: "TxnDate >= '2021-12-01'; excludes current incomplete month"
            why: "data quality floor; in-progress month excluded"
        methodology_source: "knowledge/verified-queries/int_customer_mrr.sql. Justin-verified pattern."
        parity_verified:
          against: "Pre-migration BQ values for 6 months (Round 4)"
          date: "2026-05-14"
          values: "all penny-match"
        caveats:
          - "Pre-FX. Each currency at face value."
          - "Excludes one-time Prepay Expiry write-offs (per CEO methodology) — diverges from board-deck monthly retention by ~4-6bp."
          - "Current month NOT shown."
        used_by:
          - "Method Monday (Revenue / Retention section)"
          - "Monthly GRR (#382) as input"
          - "Monthly NRR (#383) as input"
      labels:
        metric_id: '379'
        layer: metrics
        type: simple
        status: live
        verified_at: '2026-05-14'
        source_table: v_customer_mrr
        source_measure_safe: sum_cancellations
        depends_on: ''
