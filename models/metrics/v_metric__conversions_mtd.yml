# Canonical metric definition for "Conversions MTD (through yesterday)".

models:
  - name: v_metric__conversions_mtd
    description: |
      Conversions with a FirstSaaSInvoiceTxnDate in the current month,
      strictly before today. Pairs with the complete-days trajectory.
      Distinct from Conversions (#56), which is the full-month total and
      stays that way. Also backs the Sales Scorecard Conversions tile,
      which moves 21 -> 20.
    config:
      materialized: view
      meta:
        answers: "How many conversions have we had this month, counting only finished days?"
        grain: "Single row, current month. Account-grain (see Conversions #56)."
        filters:
          - rule: "FirstSaaSInvoiceTxnDate < CURRENT_DATE()"
            why: "today is unfinished; including it would not match the trajectory divisor"
          - rule: "inherits int_conversions"
            why: "carried from Conversions #56"
        methodology_source: "Method Monday convention, verified against Looker report 510f74bb page p_rh9bepy1rd on 2026-08-10."
        parity_verified:
          against: "Looker Studio 'Method Monday (PROD)', report 510f74bb, page p_rh9bepy1rd, data timestamp 12:39 PM, read 2026-08-17."
          values: "28 (Looker) = 28 (model), exact match. Note: at ~11:00 the same day this view read 27 against Looker's 28; by ~12:45 it read 28 -- a 2026-08-16 conversion landed in the nightly mirror between the two reads. Both readings were correct at the time they were taken; this pipeline is not intraday-reproducible by design (nightly mirror), which argues for a fixed daily snapshot rather than live reads for anything published from this data."
        caveats:
          - "Excludes today by design. Not the same number as Conversions #56 for the current month."
          - "Single-row by design. Do not chart it as a time series."
          - "Also backs the Sales Scorecard Conversions tile (moves 21 -> 20)."
        used_by:
          - "Method Monday (Conversions section)"
          - "Sales Scorecard (Conversions tile)"
      labels:
        metric_id: '408'
        layer: metrics
        type: simple
        status: queued
        source_table: int_method_monday
        source_measure_safe: ''
        depends_on: '56'
    columns:
      - name: period
        description: Current month (single row).
        tests:
          - not_null
          - unique
      - name: value
        description: Conversions MTD count. COUNT(*) is always defined, so never NULL.
        tests:
          - not_null
