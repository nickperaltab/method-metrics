# Canonical metric definition for "Syncs MTD (through yesterday)".

models:
  - name: v_metric__syncs_mtd
    description: |
      Syncs with a SyncDate in the current month, strictly before today.
      Pairs with the complete-days trajectory. Distinct from Syncs (#55),
      which is the full-month total and stays that way.
    config:
      materialized: view
      meta:
        answers: "How many syncs have we had this month, counting only finished days?"
        grain: "Single row, current month. Account-grain (see Syncs #55)."
        filters:
          - rule: "SyncDate < CURRENT_DATE()"
            why: "today is unfinished; including it would not match the trajectory divisor"
          - rule: "inherits int_syncs"
            why: "carried from Syncs #55"
        methodology_source: "Method Monday convention, verified against Looker report 510f74bb page p_rh9bepy1rd on 2026-08-10."
        parity_verified:
          against: "PENDING — Task 8 records the browser comparison"
          values: "PENDING"
        caveats:
          - "Excludes today by design. Not the same number as Syncs #55 for the current month."
          - "Single-row by design. Do not chart it as a time series."
        used_by:
          - "Method Monday (Acquisition section)"
      labels:
        metric_id: '407'
        layer: metrics
        type: simple
        status: queued
        source_table: int_method_monday
        source_measure_safe: ''
        depends_on: '55'
