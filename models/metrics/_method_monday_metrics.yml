    config:
      materialized: view
      labels:
        metric_id: '412'
        layer: metrics
        type: derived
        status: queued
      meta:
        answers: "How many conversions should we have by now if we were exactly on forecast?"
        grain: "period-only — one row, current month"
        filters: []
        methodology_source: >
          No independent methodology. Inherits everything from int_method_monday, which
          carries the filters, the MTD convention (excludes today) and the trajectory rules.
          Adopted into dbt 2026-09-08 from a hand-cut BigQuery view.
        parity_verified:
          against: "the pre-adoption hand-cut BigQuery view"
          date: "2026-09-08"
          values: >
            Compiled SQL diffed against the deployed view DDL — identical in substance. Values could NOT be read: this view depends on method_forecast, a Sheets-federated EXTERNAL table, and neither the BigQuery MCP nor local dbt holds the Drive scope (PR #48 added it to the browser OAuth flows only). Re-verify the values once a non-browser caller has Drive access.
        caveats:
          - "Current month only — int_method_monday cannot answer for any other month."
          - "Depends on method_forecast, a Sheets-federated EXTERNAL table. Callers without the Drive OAuth scope get a 403, not an empty result."
        used_by:
          - "Method Monday deck"
          - "Sales and Marketing scorecards in the metrics app"

