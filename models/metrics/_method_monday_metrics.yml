version: 2

# The thirteen thin projections of int_method_monday.
#
# None of these carries a definition of its own. Each renames one column of
# int_method_monday into the (period, value) contract the registry and the scorecard
# query planner expect. The business definition, every filter, and the early-month
# trajectory suppression all live upstream — which is why `filters` is deliberately
# empty here rather than absent: considered, and none apply at this layer.
#
# Bodies are generated by the method_monday_metric macro so the shape is defined once.

models:
  - name: v_metric__trials_mtd
    description: >
      Trials so far this month, excluding today. A projection of int_method_monday into (period, value); the definition
      lives upstream in that model.
    config:
      materialized: view
      labels:
        metric_id: '406'
        layer: metrics
        type: simple
        status: queued
      meta:
        answers: "How many trials have we had so far this month, through yesterday?"
        grain: "period-only — one row, current month"
        filters: []
        methodology_source: >
          No independent methodology. Inherits everything from int_method_monday, which
          carries the filters, the MTD convention (excludes today) and the trajectory rules.
          Adopted into dbt 2026-09-08 from a hand-cut BigQuery view.
        parity_verified:
          against: "the pre-adoption hand-cut BigQuery view"
          date: "2026-09-08"
          values: >
            Every value identical to the pre-adoption hand-cut view, read 2026-09-08: trials_mtd 87, syncs_mtd 44, conversions_mtd 19, churn_mtd 25, sync_rate_mtd 50.574713, churn_rate_mtd 0.658415, trials_trajectory 372.857143, syncs_trajectory 188.571429, conversions_trajectory 81.428571, churn_trajectory 107.142857, churn_rate_trajectory 2.776133.
        caveats:
          - "Current month only — int_method_monday cannot answer for any other month."
        used_by:
          - "Method Monday deck"
          - "Sales and Marketing scorecards in the metrics app"

