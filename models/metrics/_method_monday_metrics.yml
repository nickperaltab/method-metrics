    config:
      materialized: view
      labels:
        metric_id: '410'
        layer: metrics
        type: derived
        status: queued
      meta:
        answers: "At the current run rate, where will trials land this month?"
        grain: "period-only — one row, current month"
        filters: []
        methodology_source: >
