# Canonical metric definition for "Customers" (#373).
#
# Counts the number of distinct active Method customers each month
# (EntityRecordID grain — see knowledge/glossary.md "Customer vs Account").
# Materialization of the canonical Supabase definition:
#   - semantic_table:   v_customers
#   - semantic_measure: COUNT(DISTINCT EntityRecordID)
#   - semantic_date_col: Month
#   - filter:           IsActive = TRUE

models:
  - name: v_metric__customers
    description: |
      Monthly count of unique active Method customers — companies with
      revenue activity in the month. Customer-grain — a company with
      multiple Method accounts counts ONCE per month (unlike Trials,
      which counts each account separately). Current month is incomplete;
      partial values until month-end.
    config:
      materialized: view
      labels:
        metric_id: '373'
        layer: metrics
        type: simple
        status: live
        verified_at: '2026-05-12'
        source_table: v_customers
        source_measure_safe: count_distinct_entityrecordid
        depends_on: ''
