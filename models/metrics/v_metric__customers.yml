# Canonical metric definition for "Customers" (#373).
#
# Counts the number of distinct active Method customers each month
# (EntityRecordID grain — see knowledge/glossary.md "Customer vs Account").
# Materialization of the canonical Supabase definition:
#   - semantic_table:   v_customers
#   - semantic_measure: COUNT(DISTINCT EntityRecordID)
#   - semantic_date_col: Month
#   - filter:           IsActive = TRUE

models:
  - name: v_metric__customers
    description: |
      Monthly count of unique active Method customers — companies with
      revenue activity in the month. Customer-grain — a company with
      multiple Method accounts counts ONCE per month (unlike Trials,
      which counts each account separately). Current month is incomplete;
      partial values until month-end.
    config:
      materialized: view
      meta:
        answers: "How many unique paying Method customers had revenue activity in each month?"
        grain: "customer-level (EntityRecordID). A customer with multiple Method accounts counts ONCE per month."
        filters:
          - rule: "IsActive = TRUE"
            why: "applied to match Supabase's canonical filter. NOTE: this is redundant in practice — int_customers only contains customer-months with revenue activity, so all rows have IsActive = TRUE. Filter applied anyway for definitional consistency."
          - rule: "Partner != 'Method Integration' (upstream in int_customers)"
            why: "internal Method partner accounts already excluded upstream"
        methodology_source: "Existing BQ view int_customers + Supabase metric #373 semantic definition."
        parity_verified:
          against: "Pre-migration BQ values for 12 months (Jun 2025 – May 2026) (Round 3b)"
          date: "2026-05-12"
          values: "all penny-match"
        caveats:
          - "Customer-grain. A customer with multiple Method accounts counts ONCE."
          - "Includes any customer with revenue activity in the month — not separately broken out into 'new customer this month' vs 'existing.' For new customers specifically, use New Customers — Actual (#39)."
          - "Current month is incomplete; partial values for the in-progress month."
        used_by:
          - "Method Monday (Revenue section)"
          - "ARPC calculations"
          - "Customer count for ratio metrics"
      labels:
        metric_id: '373'
        layer: metrics
        type: simple
        status: live
        verified_at: '2026-05-12'
        source_table: v_customers
        source_measure_safe: count_distinct_entityrecordid
        depends_on: ''
