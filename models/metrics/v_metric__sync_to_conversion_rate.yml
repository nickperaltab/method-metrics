# Canonical metric definition for "Sync-to-Conversion Rate" (#301).

models:
  - name: v_metric__sync_to_conversion_rate
    description: |
      Monthly Sync-to-Conversion Rate — conversions divided by syncs that
      month, at account-grain. Measures how well synced accounts progress
      to paying customers. Both numerator and denominator are account/event
      counts (see Conversions #56 and Syncs #55). Use for funnel-stage
      analysis, not as a clean "% of unique sync cohort that converted."
    config:
      materialized: view
      meta:
        answers: "What fraction of sync milestones progressed to conversion that month?"
        grain: "Period-level ratio. Both numerator and denominator are account/event counts."
        parity_verified:
          against: "Sanity-checked against the live chart builder"
          values: "values in 24-33% range"
        caveats:
          - "Denominator is event-grain Syncs (#55), dated by signup rather than by sync completion — revenue.Funnel's Sync branch projects SignupDate AS Date, so 'syncs in month M' means accounts that signed up in M and have sync data. Measured fan-in at the monthly grain this metric carries is about 1.5%. Do NOT quote the ~9-13% figure that #55's own yml still states: that is an all-time cumulative number, and the 're-syncs after disconnect/reconnect' mechanism it describes does not exist in the data (zero repeat sync events; the ~9% of entities with multiple rows are multi-account customers). See scripts/reconcile_sync_denominators.py output."
          - "Not a clean '% of sync cohort that converted'. Measured against that read, this metric was +1.02 pp HIGH on the current 12 months (27.27% shipped vs 26.25% cohort-consistent) and +0.02 pp on the prior 12 (24.00% vs 23.99%). The gap is window-dependent, not a standing directional bias — quote it with the prior window beside it."
          - "Only 50.2% of month-M conversions signed up in month M, so numerator and denominator share a month label rather than a cohort."
        used_by:
          - "Funnel-stage analysis"
          - "Sales Scorecard (Sync Conversion Rate section) — KPI tile. NOTE: the Supabase row for #301 is a FORMULA metric (SAFE_DIVIDE({56},{55}) * 100) with chart_sql and view_name NULL, so the app evaluates the formula and emits a PERCENTAGE (32.89). This view emits a DECIMAL (0.3289). Consumers must not mix the two."
          - "Funnel Scorecard (Sync-to-Conversion Rate section)"
      labels:
        metric_id: '301'
        layer: metrics
        type: ratio
        status: live
        verified_at: '2026-05-14'
        source_table: ''
        source_measure_safe: ''
        depends_on: 56-55
