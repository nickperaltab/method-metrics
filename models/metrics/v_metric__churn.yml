# Canonical metric definition for "Churn" (#59).

models:
  - name: v_metric__churn
    description: |
      Monthly count of distinct Method customers that canceled, grouped by
      cancellation month. Customer-grain — uses COUNT(DISTINCT CompanyAccount)
      so a customer with multiple canceling accounts in the same month
      counts ONCE. Excludes test accounts and internal Method Integration
      partner rows. Note: this is account-count churn, not dollar churn —
      see Monthly Cancellations ($) (#379) for MRR lost.
    config:
      materialized: view
      meta:
        answers: "How many distinct Method customers canceled in each month?"
        grain: "customer-level (uses DISTINCT). A customer with multiple canceling accounts in the same month counts ONCE."
        filters:
          - rule: "Inherits from int_cancellations"
            why: "carries the upstream cancellation filters"
        parity_verified:
          against: "6 months (Round 4)"
          date: "2026-05-14"
          values: "penny-match"
        caveats:
          - "Account-count churn, not dollar churn. For MRR-lost-to-cancellations, use Monthly Cancellations ($) (#379)."
        used_by:
          - "Method Monday (Retention section)"
      labels:
        metric_id: '59'
        layer: metrics
        type: simple
        status: live
        verified_at: '2026-05-14'
        source_table: v_cancellations
        source_measure_safe: count_distinct_companyaccount
        depends_on: ''
