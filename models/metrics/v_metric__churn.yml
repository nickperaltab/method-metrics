# Canonical metric definition for "Churn" (#59).

models:
  - name: v_metric__churn
    description: |
      Monthly count of Method billing accounts (CompanyAccount grain) that
      canceled, grouped by cancellation month. COUNT(DISTINCT CompanyAccount)
      is measured identical to COUNT(*) in every recent month (6/6 checked)
      — int_cancellations is already one row per Account, so the DISTINCT
      performs no customer-level dedup. A customer that owns several
      canceling CompanyAccounts (e.g. a franchise network closing multiple
      per-location accounts in one event) counts once per account, not once
      per customer. Excludes test accounts and internal Method Integration
      partner rows. Note: this is account-count churn, not dollar churn —
      see Monthly Cancellations ($) (#379) for MRR lost.
    config:
      materialized: view
      meta:
        answers: "How many Method billing accounts (CompanyAccounts) canceled in each month?"
        grain: "CompanyAccount (billing-account) grain, not customer grain. COUNT(DISTINCT CompanyAccount) equals COUNT(*) here — there is no customer-level dedup happening despite the DISTINCT in the SQL."
        filters:
          - rule: "Inherits from int_cancellations"
            why: "carries the upstream cancellation filters"
        parity_verified:
          against: "6 months (Round 4)"
          date: "2026-05-14"
          values: "penny-match"
        caveats:
          - "Account-count churn, not dollar churn. For MRR-lost-to-cancellations, use Monthly Cancellations ($) (#379)."
          - "Billing-account grain, not customer grain: a customer (EntityRecordID) with multiple canceling CompanyAccounts is counted once per account. A franchise network closing N per-location accounts in one cancellation event reads as N here, not 1 — see Accounts Churned MTD (#409) for a concrete example (2026-08-14, EntityRecordID 32049)."
        used_by:
          - "Method Monday (Retention section)"
      labels:
        metric_id: '59'
        layer: metrics
        type: simple
        status: live
        verified_at: '2026-05-14'
        source_table: v_cancellations
        source_measure_safe: count_distinct_companyaccount
        depends_on: ''
