# Canonical metric definition for "Monthly GRR %" (#382).
# CEO-confirmed methodology (2026-04-28). MUST NOT change without
# explicit CEO + Justin sign-off.

models:
  - name: v_metric__monthly_grr
    description: |
      Monthly Gross Revenue Retention — fraction of last month's MRR
      retained this month, excluding expansion. Formula: (StartMRR -
      Cancellations - Downgrades) / StartMRR. Pre-FX. Typical values
      95-97%. Uses CEO-confirmed symmetric Prepay Expiry exclusion;
      diverges from board-deck monthly GRR by ~4-6bp because the deck
      uses asymmetric methodology. For any number heading to the board,
      reconcile against the deck first.
    config:
      materialized: view
      meta:
        answers: "Fraction of last month's MRR retained this month, excluding expansion: (StartMRR - Cancellations - Downgrades) / StartMRR. Typical 95-97%."
        grain: "Period-level fraction. Outputs as decimal (e.g., 0.965817 = 96.5817%)."
        methodology_source: "CEO-protected family. Methodology was explicitly confirmed by Method's CEO on 2026-04-28 (symmetric Prepay Expiry exclusion). MUST NOT change without explicit CEO + Justin sign-off. Cross-model derived metric combining the MRR family inputs."
        parity_verified:
          against: "5 months x 4 metrics = 20 / 20 spot-check (Round 5)"
          date: "2026-05-14"
          values: "match to 6 decimal places"
        caveats:
          - "Pre-FX."
          - "Symmetric Prepay Expiry methodology — diverges from board-deck retention by ~4-6bp."
          - "For any number heading to the board or external reporting, reconcile against the board deck first. These numbers will not penny-match the deck."
          - "Current month NOT shown."
        used_by:
          - "Board reporting (with deck reconciliation)"
      labels:
        metric_id: '382'
        layer: metrics
        type: derived
        status: live
        verified_at: '2026-05-14'
        source_table: ''
        source_measure_safe: ''
        depends_on: 378-379-380
