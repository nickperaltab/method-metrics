# Canonical metric definition for "Annual NRR %" (#389).
# CEO-confirmed methodology. MUST NOT change without explicit CEO sign-off.

models:
  - name: v_metric__annual_nrr
    description: |
      Annual Net Revenue Retention — fraction of last year's MRR retained
      this year-end cohort INCLUDING expansion from existing customers.
      Formula: (Annual StartMRR - Annual Cancellations - Annual Downgrades
      + Annual Expansions) / Annual StartMRR. Pre-FX. Typical values
      88-90%. Lower than monthly NRR because more churn accumulates over
      12 months. Uses CEO-confirmed methodology; reconcile against board
      deck before external use.
    config:
      materialized: view
      meta:
        answers: "Annual NRR. Typical 88-90%."
        grain: "Period-level fraction. Outputs as decimal (e.g., 0.965817 = 96.5817%)."
        methodology_source: "CEO-protected family. Methodology was explicitly confirmed by Method's CEO on 2026-04-28 (symmetric Prepay Expiry exclusion). MUST NOT change without explicit CEO + Justin sign-off. Cross-model derived metric combining the MRR family inputs."
        parity_verified:
          against: "5 months x 4 metrics = 20 / 20 spot-check (Round 5)"
          date: "2026-05-14"
          values: "match to 6 decimal places"
        caveats:
          - "Pre-FX."
          - "Symmetric Prepay Expiry methodology — diverges from board-deck retention by ~4-6bp."
          - "For any number heading to the board or external reporting, reconcile against the board deck first. These numbers will not penny-match the deck."
          - "Current month NOT shown."
        used_by:
          - "Method Monday (Retention section, headline metrics)"
          - "Board reporting (with deck reconciliation)"
      labels:
        metric_id: '389'
        layer: metrics
        type: derived
        status: live
        verified_at: '2026-05-14'
        source_table: ''
        source_measure_safe: ''
        depends_on: 384-385-386-387
