# Canonical metric definition for "Conversions Trajectory" (#296).

models:
  - name: v_metric__conversions_trajectory
    description: |
      Month-end projection of conversions for the in-progress month. Counts
      conversions through yesterday, divides by COMPLETE days
      (day_of_month - 1), and scales to the full month. Returns exactly one
      row for the current month — trajectory has no meaning for a closed
      month.
    config:
      materialized: view
      meta:
        answers: "If the current month continues at its month-to-date pace, how many conversions will it finish with?"
        grain: "Single row, current month. Account-grain numerator (see Conversions #56)."
        filters:
          - rule: "inherits int_method_monday.conversions_mtd, which excludes FirstSaaSInvoiceTxnDate >= CURRENT_DATE()"
            why: "today is unfinished; the trajectory divides by complete days only"
        methodology_source: "Method Monday convention (docs/superpowers/specs/2026-08-10-method-monday-design.md, Conventions), superseding the prior Looker-Sales-page-derived convention."
        parity_verified:
          against: "PENDING — Task 8 records the browser comparison"
          values: "PENDING"
        caveats:
          - "Convention changed 2026-08-10: divides by COMPLETE days (day_of_month - 1) counting through yesterday. Previously counted through today and divided by day_of_month. Moves this metric 55.36 -> 57.23 (measured 2026-08-14) and cascades to Supabase metrics 321, 322 and 323. Deliberately diverges from Looker's Sales page, which retains the old convention; matches Looker's Method Monday page."
          - "History: the old through-today / day_of_month convention was verified exact against the live Looker Sales Scorecard on 2026-08-10 (65.1 vs 65.1; cascaded to #321 12.45%, #322 -5.52%, #323 69.28%). That parity record no longer applies — it was for the superseded convention. See the line above for the new one."
          - "Divisor is complete days, which means the projection is still noisy in the first few days of a month. Expect wide swings before roughly the 5th."
          - "Single-row by design. Do not chart it as a time series."
        used_by:
          - "Sales Scorecard (Conversion Rate section)"
          - "Sync Conversion Rate Trajectory"
      labels:
        metric_id: '296'
        layer: metrics
        type: derived
        status: queued
        verified_at: '2026-08-04'
        source_table: int_conversions
        source_measure_safe: count_star
        depends_on: '56'
