# Canonical metric definition for "Sync Rate MTD (through yesterday)".

models:
  - name: v_metric__sync_rate_mtd
    description: |
      Syncs divided by trials, both counted through yesterday, expressed as
      a percentage. Shares its elapsed window with everything else on the
      Method Monday page. Distinct from Sync Rate (#300), which is the
      full-month ratio.
    config:
      materialized: view
      meta:
        answers: "What share of this month's trials have synced so far, counting only finished days?"
        grain: "Single row, current month. Period-level ratio over account-grain counts (see Trials #54, Syncs #55)."
        filters:
          - rule: "inherits int_method_monday.syncs_mtd and .trials_mtd, both strictly before today"
            why: "today is unfinished; keeps this consistent with every other MTD tile on the page"
        methodology_source: "Method Monday convention, verified against Looker report 510f74bb page p_rh9bepy1rd on 2026-08-10."
        parity_verified:
          against: "Looker Studio 'Method Monday (PROD)', report 510f74bb, page p_rh9bepy1rd, data timestamp 12:39 PM, read 2026-08-17."
          values: "50.6% (Looker) = 50.6% (model), exact match."
        caveats:
          - "Emits a percentage (50.0), not a decimal (0.50). Matches Sync Rate #300 and Forecasted Sync Rate #361's convention so the tiles can sit side by side without rescaling."
          - "Excludes today by design. Not the same number as Sync Rate #300, which is the full-month ratio."
          - "NULL when trials_mtd is 0 — early in a month that is genuinely undefined, not zero."
          - "Single-row by design. Do not chart it as a time series."
        used_by:
          - "Method Monday (Acquisition section)"
      labels:
        metric_id: '414'
        layer: metrics
        type: ratio
        status: queued
        source_table: int_method_monday
        source_measure_safe: ''
        depends_on: '55-54'
