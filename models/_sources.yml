# Source declarations for Method's `revenue` BigQuery dataset.
#
# Includes raw tables (Account, Funnel, TransLineFlattened, method_forecast)
# and BQ-managed intermediate views that are not yet dbt-managed
# (v_customers, v_customer_mrr, etc.).
#
# The v_* intermediate views are intentionally declared as sources, NOT
# models, until Phase 1.5 migrates them to dbt-managed `int_*` models.
# Declaring them as sources here lets metric models use `{{ source(...) }}`
# instead of hardcoded paths — gives us lineage and one-line refactor when
# Phase 1.5 lands.

version: 2

sources:
  - name: revenue
    database: project-for-method-dw
    schema: revenue
    description: |
      Method's revenue dataset in BigQuery. Source of truth for all metric
      computations. Raw tables (Account, Funnel, TransLineFlattened) loaded
      nightly by the Alocet pipeline. Intermediate views (v_customers,
      v_customer_mrr, etc.) hand-managed in BQ today; will be migrated to
      dbt-managed `int_*` models in Phase 1.5.

    tables:
      # ----- Raw source tables (Alocet-managed) -----
      - name: Account
        description: One row per Method account (entity-grained snapshot). Primary key columns RecordID (account level) and EntityRecordID (customer level — can repeat across rows when a customer has multiple accounts). ~1.22 rows per EntityRecordID — dedup before any customer-grain join.
        columns:
          # ----- Keys -----
          - name: RecordID
            description: Account-level primary key (one row per account).
          - name: CompanyAccount
            description: The account's unique subdomain-style name. Account-level key used in joins to v7_classification.account_entity_map.company_account. One customer (EntityRecordID) can own many CompanyAccounts.
          - name: EntityRecordID
            description: Customer-level key — one customer = one EntityRecordID, owning 1+ account rows. CRITICAL — this table averages ~1.22 rows per EntityRecordID, so always dedup/aggregate before joining at customer grain (fan-out here has caused real bugs).
          # ----- Lifecycle -----
          - name: SignUpDate
            description: Date the account signed up for a trial.
          - name: FirstSaaSInvoiceTxnDate
            description: Date of the account's first SaaS invoice — the trial-to-paid conversion anchor. Epoch-junk dates exist; clean to 2000+ before computing tenure.
          - name: IsTrialConverted
            description: TRUE when the account has converted to a paying subscriber. Metric work generally filters to IsTrialConverted = TRUE.
          - name: IsActive
            description: Whether the account is still active (has not cancelled its trial or paid subscription). NULL CancellationDate does not imply paying-in-good-standing — non-payers can sit on billing hold before a cancellation is recorded.
          - name: CancellationDate
            description: Date the account cancelled. NULL for active accounts, but see IsActive caveat on billing holds.
          - name: CancellationReason
            description: Cancellation reason selected at cancellation time.
          - name: CancellationReasonCategory
            description: Category rollup of CancellationReason.
          - name: CancellationReasonOther
            description: Free-text cancellation reason when the selected reason is "Other".
          - name: IsChurnException
            description: Flag excluding the account from churn counts (data-quality/exception handling).
          - name: IsConversionException
            description: Flag excluding the account from conversion counts (data-quality/exception handling). int_customers filters these out.
          # ----- CustDat* (nightly data-miner snapshot fields) -----
          - name: CustDatAnnualSales
            description: "Company annual sales derived from the customer's synced QuickBooks data: the most recent month's invoices + sales receipts extrapolated to 12 months. Refreshed nightly on active accounts; freezes at last value when inactive. No currency normalization (value is in the QB file's home currency). NULL when there is no synced invoice history."
          - name: CustDatCountOfCustomers
            description: Count of active customers in the account's Method CRM. Refreshed nightly on active accounts.
          - name: CustDatCountOfEmployees
            description: Number of employees in the account's Method CRM, on synced accounts. Refreshed nightly on active accounts.
          - name: CustDatFirstSyncCompleted
            description: When the account's first sync completed. Checked nightly on active accounts. The validated sync-completion signal — prefer this over SyncTypeRegion for counting synced accounts.
          - name: CustDatIndustry
            description: Free-text industry pulled from the customer's synced QB/Xero company data. Verified nightly on active accounts, but only replaces the value when Vertical is null.
          - name: CustDatLastRefreshed
            description: Timestamp of the last nightly data-miner refresh. At least nightly for active accounts; freezes at the last active date for inactive accounts.
          - name: Custdatlastsaasamount
            description: "Current SaaS subscription amount on the account, refreshed nightly. Exceptions: (a) prepay discount not included, (b) legacy stepped pricing, (c) excludes extras like portals and overages. Snapshot field — do NOT use for recognized-revenue metrics (canonical is TransLineFlattened.SaaSAmount); accepted only as a labeled directional run-rate proxy."
          - name: Custdatpreviouslastsaasamount
            description: Previous day's Custdatlastsaasamount, set nightly. Enables day-over-day detection of subscription changes.
          - name: CountOfCustomScreens
            description: Number of custom screens on the account's M:C engine version. Refreshed nightly on active accounts.
          - name: CountOfCustomScreensMN
            description: Number of custom screens on the account's M:N engine version. Refreshed nightly on active accounts.
          # ----- Attribution -----
          - name: Channel
            description: Legacy channel string; unused in the dbt models — prefer the Att_* flags / int_customers.AttributionChannel.
          - name: Att_Backlinks
            description: One-hot signup-attribution flag for the Backlinks channel. int_customers collapses the Att_* flags into AttributionChannel.
          - name: Att_Banner_Ads
            description: One-hot signup-attribution flag for the Banner Ads channel.
          - name: Att_Content
            description: One-hot signup-attribution flag for the Content channel.
          - name: Att_Direct
            description: One-hot signup-attribution flag for the Direct channel.
          - name: Att_Email
            description: One-hot signup-attribution flag for the Email channel.
          - name: Att_Help_Center
            description: One-hot signup-attribution flag for the Help Center channel.
          - name: Att_None
            description: One-hot signup-attribution flag meaning no attribution channel was recorded.
          - name: Att_OPN_Other_Peoples_Networks
            description: One-hot signup-attribution flag for the OPN (Other People's Networks) channel.
          - name: Att_Online_Chat_Tool
            description: One-hot signup-attribution flag for the Online Chat Tool channel.
          - name: Att_Other
            description: One-hot signup-attribution flag for the Other channel.
          - name: Att_Partners
            description: One-hot signup-attribution flag for the Partners channel.
          - name: Att_Pay_Per_Click
            description: One-hot signup-attribution flag for the PPC (pay-per-click) channel.
          - name: Att_Referral_Link
            description: One-hot signup-attribution flag for the Referral Link channel (mapped to 'Referral' in AttributionChannel).
          - name: Att_Referral_Program
            description: One-hot signup-attribution flag for the Referral Program channel.
          - name: Att_Remarketing
            description: One-hot signup-attribution flag for the Remarketing channel.
          - name: Att_SEO
            description: One-hot signup-attribution flag for the SEO channel.
          - name: Att_Seminar_Conference
            description: One-hot signup-attribution flag for the Seminar/Conference channel.
          - name: Att_Social
            description: One-hot signup-attribution flag for the Social channel.
          # ----- Other -----
          - name: CookieRecordID
            description: Attribution cookie record ID used for signup-source tracking (e.g. whether the account arrived via SEO, a partner, etc.).
          - name: HealthScore
            description: Lead score for trial accounts. Not populated or up to date for all accounts (field predates current health-score system).
          - name: LicenseCount
            description: Number of paid user licenses on the account.
          - name: Offering
            description: QuickBooks offering SKU (QBO accounts only).
          - name: Partner
            description: Partner associated with the account (partner-referred / partner-managed context). Metric models exclude internal rows where Partner = 'Method Integration'.
          - name: Platform
            description: Whether the account is on the new version, the classic version, or has access to both.
          - name: SaaSPayType
            description: Whether the account pays on a monthly or pre-pay basis.
          - name: Sector
            description: "Sector (hierarchy: Vertical > Sector). If empty and CustDatIndustry matches a known sector in the source system, it is back-filled from CustDatIndustry during the nightly refresh."
          - name: SignupCountry
            description: Country associated with the IP address of the initial signup, captured on the signup form.
          - name: SyncType
            description: "Accounting-platform sync type. Values: None (never chose accounting software), QuickBooks (chose QB in onboarding but not yet QBDT vs QBO), Xero, QB-Desktop (once sync started), IA-QBO-V3 (QB Online once sync started)."
          - name: SyncTypeRegion
            description: Country/region of the QuickBooks product version; populated only after the account has performed a sync. Known to undercount completed syncs — prefer CustDatFirstSyncCompleted as the sync-completion signal.
          - name: Vertical
            description: "Vertical (hierarchy: Vertical > Sector). Derived nightly from the account's Sector via the source system's sector-to-vertical mapping."
      - name: Entity
        description: One row per customer entity. RecordID is the customer-level PK (joins to EntityRecordID elsewhere); EntityFullName is the display name. Used by int_customers.
      - name: Funnel
        description: One row per lifecycle event (Sync, Conversion, etc.). EntityRecordID maps back to a customer.
      - name: TransLineFlattened
        description: One row per invoice line. Source of truth for all revenue computation. SaaSAmount is the canonical revenue column.
      - name: Activity
        description: One row per CRM activity (demo, free-consulting session, call, etc.). EntityRecordID maps to a customer. ActivityType is the kind of touch; DueDateStart is the activity date (CreatedDate is NULL on most rows). Demo/free-consulting tracking effectively starts 2024.
      - name: method_forecast
        description: Sheets-federated forecast table (Google Drive scope required). Forecast values by month + channel.
      - name: method_forecast_typed
        description: |
          Same Google Sheet, same federation options, identical column list
          as method_forecast — but Forecasted_Trials, Forecasted_Syncs, and
          Forecasted_Conversion are explicitly typed FLOAT64. Exists because
          BigQuery's schema autodetect on method_forecast inferred INTEGER
          for those three columns, which rounds every daily fractional
          forecast value before it can be summed (e.g. 20.6667/day becomes
          21/day). Verified cell-by-cell against the sheet. Retire this
          table once method_forecast itself is retyped to FLOAT64 for those
          columns.
      - name: v_trials_forecast_channel
        description: Per-channel monthly trials forecast (forecast_date = month start, AttributionChannel, forecast_value). Powers the Channel Trajectory scorecard's Forecast comparison; matches Looker's per-channel Trial Forecast.
      - name: v_syncs_forecast_channel
        description: Per-channel monthly syncs forecast (forecast_date, AttributionChannel, forecast_value). Powers the Channel Trajectory scorecard's Forecast comparison; matches Looker's per-channel Sync Forecast.

      # ----- BQ-managed intermediate views (Phase 1.5 migrates these to int_*) -----
      # NOTE: int_customers is now a dbt model (models/intermediate/int_customers.sql),
      # migrated 2026-06-04 to add a deterministic dim tiebreaker. Consumers use ref().
      # NOTE: int_customer_annual_mrr is now a dbt model
      # (models/intermediate/int_customer_annual_mrr.sql), migrated 2026-06-04 to a
      # materialized table for performance. Consumers use ref().
      - name: int_conversions
        description: One row per Account with FirstSaaSInvoiceTxnDate set (account converted from trial to paying). Used by Conversions metric (#56).
      - name: int_cancellations
        description: One row per Account with CancellationDate set. Used by Churn metric (#59).

  - name: marketing
    database: project-for-method-dw
    schema: marketing
    description: |
      Marketing-owned inputs. sheet_cac_raw is the unpivoted load of the
      "2026 Trial + Sync + CAC:ARR Tracker" Google Sheet (CAC:ARR tabs),
      refreshed by scripts/marketing_spend_sync.py (WRITE_TRUNCATE). Spend
      dollars live only in BQ and the sheet, never in this repo.
    tables:
      - name: sheet_cac_raw
        description: Long-format rows (source_tab, block, channel, measure, month, scenario, value) from the marketing tracker's CAC:ARR 2025/2026 tabs. Channel names match revenue.int_customers.AttributionChannel where 1:1; TOTAL and sub-split blocks (PPC_TRIALGEN, PPC_BRANDING, Partners_NO_EVENTS) are non-canonical.

  - name: v7_classification
    database: project-for-method-dw
    schema: v7_classification
    description: V7 industry classification enrichment. v_entity_primary_label = one row per customer (customer_record_id) with the entity's primary l1 + is_multi_client.
    tables:
      - name: v_entity_primary_label
        description: One row per customer_record_id (= EntityRecordID). Columns used, l1, is_multi_client. Same source the GRR-by-Industry page uses.
